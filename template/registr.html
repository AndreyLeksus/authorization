<!DOCTYPE html>
<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="registr.css">
</head>
<body>
    <div class="card">
        <h1>Регистрация</h1>

        <form action="#" method="post">
            <div class="field">
                <p>
                <label for="login">Логин</label><br>
                <input type="text" name="login" id="login" placeholder="Введите логин" required>
                </p>
            </div>

            <div class="field">
                <p>
                <label for="password">Придумайте пароль</label><br>
                <input type="password" name="password" id="password" placeholder="Придумайте пароль">
                </p>
            </div>

            <div class="field">
                <p>
                <label for="password2">Подтвердите пароль</label><br>
                <input type="password" name="password2" id="password2" placeholder="Подтвердите пароль">
                </p>
            </div>

            <button type="submit">Регистрация</button>
        </form>
    </div>

    <p class="bottom">Уже есть аккаунт? <a href="vxod.html">Войти</a></p>
</body>
</html>
